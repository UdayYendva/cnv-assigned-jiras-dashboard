name: Update CVE Dashboard

on:
  schedule:
    - cron: '0 9 * * *'  # 9 AM UTC daily
  workflow_dispatch:      # Manual trigger button in GitHub UI

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: Generate dashboard
        env:
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_URL: https://redhat.atlassian.net
          JIRA_DASHBOARD_FILTER_URL: https://redhat.atlassian.net/issues?jql=project%20IN%20(10270)%20AND%20assignee%20IN%20(712020%3A141dd169-222c-447e-b544-78368b6226ea%2C712020%3Adef22b13-c672-4783-996c-36d495e5e11b%2C712020%3Ab34cae5b-d690-43a5-8dcf-651664b04c61%2C712020%3A373765c5-562f-433f-af75-7a2fead13af5)%20AND%20status%20!%3D%20Closed
        run: |
          echo "JIRA_USER_EMAIL=$JIRA_USER_EMAIL" > .env
          echo "JIRA_API_TOKEN=$JIRA_API_TOKEN" >> .env
          echo "JIRA_BASE_URL=$JIRA_BASE_URL" >> .env
          echo "JIRA_DASHBOARD_FILTER_URL=$JIRA_DASHBOARD_FILTER_URL" >> .env
          python3 generate_dashboard.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add index.html
          # Only commit if there are changes
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update dashboard - $(date +'%Y-%m-%d %H:%M')" && git push)
